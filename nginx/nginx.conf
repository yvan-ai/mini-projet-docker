# Configuration principale de Nginx : remplace /etc/nginx/nginx.conf de l'image officielle
# (montée en lecture seule par compose.yaml, pas de Dockerfile pour ce service).

# Un seul processus worker : empreinte mémoire minimale, suffisant pour un usage local.
worker_processes 1;

error_log /var/log/nginx/error.log warn;   # redirigé vers stderr par l'image officielle (docker compose logs proxy)
pid       /var/run/nginx.pid;              # fichier PID attendu par l'image pour les signaux de rechargement

events {
    # Connexions simultanées max par worker : largement assez en local, mémoire réduite.
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;      # table extension -> Content-Type fournie par l'image
    default_type  application/octet-stream;   # type par défaut si l'extension est inconnue
    access_log    /var/log/nginx/access.log;  # redirigé vers stdout par l'image officielle
    sendfile      on;                         # envoi de fichiers par le noyau, sans copie en espace utilisateur
    keepalive_timeout 30;                     # ferme les connexions inactives après 30 s
    server_tokens off;                        # ne pas divulguer la version de Nginx dans les en-têtes et pages d'erreur

    # DNS interne de Docker : permet de résoudre "app" par son nom de service,
    # et de re-résoudre si le conteneur app est recréé (nouvelle IP) sans redémarrer Nginx.
    # valid=10s : durée de cache de la réponse DNS ; ipv6=off : les réseaux compose sont en IPv4.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;   # port interne du conteneur ; compose le publie sur l'hôte (HTTP_PORT)

        # Healthcheck du proxy lui-même (ne dépend pas de l'app)
        location = /nginx-health {
            access_log off;                   # pas de log toutes les 10 s
            default_type text/plain;
            return 200 "ok\n";
        }

        # Tout le reste est transmis à l'application FastAPI
        location / {
            # Variable => résolution DNS à la requête (via resolver) et non une seule fois au démarrage.
            # Upstream désigné par le NOM du service compose, jamais par une IP.
            set $app_upstream http://app:8000;
            proxy_pass $app_upstream;

            proxy_http_version 1.1;           # HTTP/1.1 vers l'app (keep-alive possible)
            # En-têtes transmis à l'app : hôte demandé par le navigateur, IP réelle du client,
            # chaîne des proxys traversés, protocole d'origine (http).
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;           # au-delà, Nginx répond 504 au lieu d'attendre indéfiniment
        }
    }
}
