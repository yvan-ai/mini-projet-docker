<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion de tâches</title>
  <!-- CSS inline, aucune ressource externe (pas de CDN) : la page fonctionne hors ligne. -->
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7385;
      --border: #dde1e8; --accent: #1f6feb; --ok: #1a7f37; --danger: #c62828;
      --error-bg: #fdecec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b5;
        --border: #2c3340; --accent: #4c8dff; --ok: #3fb950; --danger: #ff6b6b;
        --error-bg: #3a1d1d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .counter { margin: 0 0 20px; color: var(--muted); }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    }
    button {
      padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.done { color: var(--ok); }
    button.delete { color: var(--danger); }
    .filters { display: flex; gap: 6px; margin-bottom: 16px; }
    .filters button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
    #error {
      display: none; margin: 0 0 16px; padding: 10px 12px; border-radius: 8px;
      background: var(--error-bg); color: var(--danger);
    }
    #error.visible { display: block; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex; align-items: center; gap: 8px; padding: 12px;
      margin-bottom: 8px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .info { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .info small { display: block; color: var(--muted); }
    li.is-done .title { text-decoration: line-through; color: var(--muted); }
    li.empty { justify-content: center; color: var(--muted); padding: 24px 0; }
  </style>
</head>
<body>
<main>
  <h1>Gestion de tâches</h1>
  <p class="counter" id="counter">Chargement…</p>

  <form id="add-form">
    <input type="text" id="title" placeholder="Nouvelle tâche" maxlength="200" required autocomplete="off">
    <button type="submit" class="primary">Ajouter</button>
  </form>

  <div class="filters" role="group" aria-label="Filtrer les tâches">
    <button type="button" data-status="all" aria-pressed="true">Toutes</button>
    <button type="button" data-status="todo" aria-pressed="false">À faire</button>
    <button type="button" data-status="done" aria-pressed="false">Faites</button>
  </div>

  <p id="error" role="alert"></p>
  <ul id="list"></ul>
</main>

<script>
  // Filtre courant : all | todo | done (même valeur que le paramètre ?status= de l'API)
  let currentStatus = "all";

  const listEl = document.getElementById("list");
  const counterEl = document.getElementById("counter");
  const errorEl = document.getElementById("error");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.toggle("visible", Boolean(message));
  }

  // Appel à l'API. Chemins RELATIFS uniquement (/api/...) : la page parle au même hôte et
  // au même port que celui qui l'a servie, donc au reverse proxy, quel que soit HTTP_PORT.
  async function api(method, path, body) {
    const options = { method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const res = await fetch(path, options);
    if (!res.ok) {
      // Message lisible : "detail" de FastAPI (texte ou liste d'erreurs de validation)
      let detail = res.statusText;
      try {
        const data = await res.json();
        detail = typeof data.detail === "string" ? data.detail : data.detail.map(d => d.msg).join(", ");
      } catch (e) { /* réponse non JSON (ex. 502 du proxy) : on garde statusText */ }
      throw new Error(`Erreur ${res.status} : ${detail}`);
    }
    return res.status === 204 ? null : res.json();
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  }

  // Construit une ligne de la liste. Le titre (donnée saisie par un utilisateur) est inséré
  // avec textContent, JAMAIS innerHTML : une balise <script> dans un titre reste du texte (anti XSS).
  function renderTask(task) {
    const li = document.createElement("li");
    if (task.done) li.classList.add("is-done");

    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = task.title;
    const meta = document.createElement("small");
    meta.textContent = task.done
      ? `Faite le ${formatDate(task.done_at)}`
      : `Créée le ${formatDate(task.created_at)}`;
    info.append(title, meta);
    li.append(info);

    if (!task.done) {
      const doneBtn = document.createElement("button");
      doneBtn.className = "done";
      doneBtn.textContent = "Fait";
      doneBtn.addEventListener("click", () => run(() => api("PATCH", `/api/tasks/${task.id}/done`)));
      li.append(doneBtn);
    }

    const delBtn = document.createElement("button");
    delBtn.className = "delete";
    delBtn.textContent = "Supprimer";
    delBtn.addEventListener("click", () => run(() => api("DELETE", `/api/tasks/${task.id}`)));
    li.append(delBtn);
    return li;
  }

  // Recharge la liste filtrée (via l'API) et le compteur global.
  async function refresh() {
    const [filtered, all] = await Promise.all([
      api("GET", `/api/tasks?status=${currentStatus}`),
      api("GET", "/api/tasks?status=all"),
    ]);
    const doneCount = all.filter(t => t.done).length;
    counterEl.textContent = `${all.length - doneCount} à faire / ${doneCount} faites`;

    listEl.replaceChildren(...filtered.map(renderTask));
    if (filtered.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "Aucune tâche";
      listEl.append(empty);
    }
  }

  // Exécute une action puis rafraîchit ; toute erreur est affichée à l'utilisateur.
  async function run(action) {
    try {
      await action();
      showError("");
      await refresh();
    } catch (e) {
      showError(e.message);
    }
  }

  document.getElementById("add-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("title");
    // Champ désactivé pendant l'envoi : évite un double envoi ou une saisie mélangée.
    input.disabled = true;
    await run(async () => {
      await api("POST", "/api/tasks", { title: input.value });
      input.value = "";
    });
    input.disabled = false;
    input.focus();
  });

  document.querySelectorAll(".filters button").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentStatus = btn.dataset.status;
      document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      run(async () => {});
    });
  });

  run(async () => {});
</script>
</body>
</html>
