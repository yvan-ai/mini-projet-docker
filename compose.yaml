name: todo-docker

services:
  proxy:
    image: nginx:1.30.5-alpine3.24
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [front]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 32m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-app:1.0.0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 128m

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [back]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 256m

networks:
  front: {}
  back:
    internal: true

volumes:
  pgdata: {}
